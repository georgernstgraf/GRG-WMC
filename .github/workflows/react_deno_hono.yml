name: React + Deno Referenz-App

on:
  push:
    paths:
      - "Beispielprojekte/react_deno_hono/**"
      - ".github/workflows/react_deno_hono.yml"
  pull_request:
    paths:
      - "Beispielprojekte/react_deno_hono/**"
      - ".github/workflows/react_deno_hono.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Beispielprojekte/react_deno_hono

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deno einrichten
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Abhängigkeiten aus dem Lockfile installieren
        run: deno install --frozen

      - name: Format, Lint, Typen, Tests, Build
        run: deno task verify
